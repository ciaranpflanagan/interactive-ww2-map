name: automerge

# Merges app-code PRs without a human once CI is green and an agent review has passed
# (label `review:passed`). PRs touching protected paths always wait for the owner.
# Never checks out PR code: it only reads PR metadata through the API.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write   # dispatch deploy after merging (GITHUB_TOKEN merges don't trigger push workflows)

concurrency: automerge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4   # default branch: trusted script only
      - run: bash .github/scripts/automerge.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
