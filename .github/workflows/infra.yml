name: infra

on:
  push:
    branches: [main]
    paths: ['infra/app/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read

concurrency: infra

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preview changes (what-if)
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/app/main.bicep
      - name: Deploy
        run: |
          az deployment group create \
            --name "app-${{ github.sha }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/app/main.bicep
