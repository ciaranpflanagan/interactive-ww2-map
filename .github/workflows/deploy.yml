name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:   # automerge.yml dispatches this after merging

permissions:
  id-token: write
  contents: read
  pull-requests: write   # preview URL comment

jobs:
  site:
    # Fork PRs get no OIDC token, so they're built by CI but not previewed.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SITE_NAME: swa-ww2-map
      CLOSING: ${{ github.event.action == 'closed' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.CLOSING != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: env.CLOSING != 'true'
        run: npm ci && npm run build

      # main -> deployer identity; pull requests -> previewer identity (token-read only)
      - uses: azure/login@v2
        with:
          client-id: ${{ github.event_name != 'pull_request' && vars.AZURE_DEPLOYER_CLIENT_ID || vars.AZURE_PREVIEWER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch deployment token (never stored)
        id: token
        run: |
          t=$(az staticwebapp secrets list -n "$SITE_NAME" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query properties.apiKey -o tsv)
          echo "::add-mask::$t"
          echo "value=$t" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: env.CLOSING != 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
      - name: Remove preview environment
        if: env.CLOSING == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: close
